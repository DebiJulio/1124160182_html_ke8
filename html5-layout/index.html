<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout HTMLA - Iframe</title>
    <style>
        body{
            margin: 0;
            font-family: Arial,sans-serif;
            display: flex;
            height: 100vh;
        }
        nav {
            width: 25%;
            background-color: aquamarine;
            padding: 20px;
        }
        iframe {
            width: 75%;
            border: aquamarine;
            height: 100vh;
        }
        a {
            display: block;
            margin: 10px 0;
            text-decoration: none;
            color: black;
        }
        a:hover {
            color: aqua;
        }
    </style>
</head>
<body>
    <nav>
        <h3>Menu</h3>
        <a href="konten.html" target="ContentFrame"></a>
        <a href="profil.html" target="ContentFrame"></a>
        <a href="contact.html" target="ContentFrame"></a>
    </nav>
    <iframe name="ContentFrame" src="konten.html"></iframe>
    
</body>
</html>
